<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DocAssist — рабочее место мастера студенческого отряда: проверка анкет и документы РСО. Работает локально и офлайн." />
    <meta name="theme-color" content="#0054a6" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>DocAssist — рабочее место мастера РСО</title>
    <script>
      // Тема применяется до отрисовки, чтобы не было «вспышки» светлой темы.
      (function () {
        try {
          var pref = localStorage.getItem('docassist.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
