s.title))})]},t):null})})]})]})})]})}const s_=[{id:"what-is-rso",question:"Что такое РСО?",answer:"РСО — «Российские студенческие отряды», молодёжная организация, объединяющая студенческие отряды по всей стране: строительные, педагогические, сервисные, отряды проводников и другие. Студенты работают в свободное от учёбы время.",temporary:!0},{id:"how-check",question:"Как проверяются анкеты?",answer:"У каждого из 35 столбцов своё правило («Проверка анкет» → «Шаблоны и правила»): формат (регулярное выражение), список значений из базы («ключ:значение») или древо с конструктором — для адресов и места рождения. Значение верно, только если подходит под формат и есть в базе. База сначала пустая: новое значение помечается предупреждением, вы проверяете его и подтверждаете — оно попадает в базу, и дальше такие же значения проходят сами."},{id:"tree",question:"Что такое древо и порядок «2, 1, 3, *»?",answer:"Адрес дробится на части по запятым, а части — по пробелам: приписка («Респ.», «р-н», «ул.») и само значение. В базе части хранятся деревом, каждая внутри предыдущей: «г. Примерск» лежит внутри «Респ. Регион» — с другим регионом тот же «Примерск» уже не пройдёт. Порядок «2, 1, 3, *» говорит, в какой последовательности части ложатся в древо: вторая (регион), первая (индекс), третья (район), а «*» — все остальные по порядку. Поэтому индекс хранится под регионом, хоть и пишется первым."},{id:"confirm",question:"Почему у паспорта, СНИЛС, телефона всегда предупреждение?",answer:"Это индивидуальные значения — их нельзя проверить по базе, они свои у каждого человека. Поэтому их нужно проверить глазами и поставить галочку «Проверено, значение верное» у каждого человека отдельно. Если такое же значение есть у другого человека (в таблице или в базе людей) — это ошибка."},{id:"actual",question:"Что делает «Проверить с актуальной информацией»?",answer:"Ищет человека в базе людей по ФИО. Если запись найдена — все совпавшие поля отмечаются проверенными, а несовпавшие остаются как были и перечисляются. Если такого ФИО в базе нет — так и пишет. База людей пополняется кнопкой «В базу людей» у готовых анкет (а позже — отдельным приложением ручного ввода)."},{id:"vars",question:"Как подставить переменную?",answer:"В любом поле ввода нажмите Ctrl+Пробел — появится список глобальных переменных. Начните писать ключ или часть значения, чтобы сузить список; ↑↓ — выбор, Enter — вставить, Esc — закрыть. Сохранить значение в переменные можно из меню «⋯» у поля анкеты."},{id:"dict",question:"Откуда подсказки при наборе?",answer:"Это словарь подсказок: то, что вы вводите в поля, запоминается и подсказывается при наборе в таких же полях — в любом приложении DocAssist (имя — в полях имени, адрес — в полях адреса). ↓ — выбрать, Tab — подставить, Esc — скрыть. Посмотреть, удалить или выключить — на странице «Глобальные переменные». Хранится только в рабочей папке."},{id:"mask",question:"Что такое «Маска для исправления»?",answer:"Шаблон, по которому приложение предлагает исправление, когда значение не прошло формат. «9» — место для цифры, остальное пишется как есть. Из значения берутся все цифры и раскладываются по маске: «80001112233» с маской «8(999)999-99-99» → «8(000)111-22-33», «01012000» с маской «99.99.9999» → «01.01.2000». Если цифр больше на ведущие цифры маски («8» у телефона), они отбрасываются: «+7 000 111 22 33» → «8(000)111-22-33». Исправление показывается, только если результат проходит формат, и применяется по кнопке. Проверяет значение сам формат (regex), маска — лишь подсказка, как исправить."},{id:"paste",question:"Можно ли не загружать файл, а вставить строки?",answer:"Да. Выделите строки в Excel или Google Таблицах, нажмите Ctrl+C, откройте «Проверку анкет» и нажмите Ctrl+V (не в поле ввода). Строка заголовков не обязательна — без неё столбцы понимаются по порядку анкеты. На телефоне — кнопка «Вставить из буфера»."}];function vC(){const{hash:e}=xs();return P.useEffect(()=>{var t;e&&((t=document.getElementById(e.slice(1)))==null||t.setAttribute("o
