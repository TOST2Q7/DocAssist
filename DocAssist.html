 перечисляются. Если такого ФИО в базе нет — так и пишет. База людей пополняется кнопкой «В базу людей» у готовых анкет (а позже — отдельным приложением ручного ввода)."},{id:"vars",question:"Как подставить переменную?",answer:"В любом поле ввода нажмите Ctrl+Пробел — появится список глобальных переменных. Начните писать ключ или часть значения, чтобы сузить список; ↑↓ — выбор, Enter — вставить, Esc — закрыть. Сохранить значение в переменные можно из меню «⋯» у поля анкеты."},{id:"paste",question:"Можно ли не загружать файл, а вставить строки?",answer:"Да. Выделите строки в Excel или Google Таблицах, нажмите Ctrl+C, откройте «Проверку анкет» и нажмите Ctrl+V (не в поле ввода). Строка заголовков не обязательна — без неё столбцы понимаются по порядку анкеты. На телефоне — кнопка «Вставить из буфера»."}];function l6(){const{hash:e}=ds();return P.useEffect(()=>{var t;e&&((t=document.getElementById(e.slice(1)))==null||t.setAttribute("open",""))},[e]),v.jsxs("div",{className:"page page--narrow",children:[v.jsxs("div",{className:"page-head",children:[v.jsx("h1",{children:"Частые вопросы"}),v.jsx("p",{children:"Короткие ответы на то, о чём спрашивают чаще всего. Список будет пополняться."})]}),e_.map(t=>v.jsxs("details",{id:t.id,className:"faq",open:e_.length===1,children:[v.jsxs("summary",{children:[v.jsx("span",{className:"spacer",children:t.question}),t.temporary&&v.jsx("span",{className:"badge badge--warning",children:"временно"})]}),v.jsx("div",{className:"faq__answer",children:t.answer})]},t.id))]})}const EE="docassist.seen",c6={new:"Новое!",beta:"Бета",soon:"Скоро",updated:"Обновлено",count:"",warning:"!"};function f6(){try{return JSON.parse(localStorage.getItem(EE)??"{}")}catch{return{}}}let Pf=f6();const _m=new Set;function SE(e,t="1"){if(Pf[e]!==t){Pf={...Pf,[e]:t};try{localStorage.setItem(EE,JSON.stringify(Pf))}catch{}_m.forEach(r=>r())}}function u6(e){return _m.add(e),()=>_m.delete(e)}function o6(e,t,r=[]){const n=P.useSyncExternalStore(u6,()=>Pf),s=P.useCallbac
