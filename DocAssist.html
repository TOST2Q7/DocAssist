me:"muted",children:s.title})]},s.abbr+s.title))})]},t):null})})]})]})})]})}const D_=[{id:"what-is-rso",question:"Что такое РСО?",answer:"РСО — «Российские студенческие отряды», молодёжная организация, объединяющая студенческие отряды по всей стране: строительные, педагогические, сервисные, отряды проводников и другие. Студенты работают в свободное от учёбы время.",temporary:!0},{id:"how-check",question:"Как проверяются анкеты?",answer:"У каждого из 35 столбцов своё правило («Проверка анкет» → «Шаблоны и правила»): формат (регулярное выражение), список значений из базы («ключ:значение») или древо с конструктором — для адресов и места рождения. Значение верно, только если подходит под формат и есть в базе. База сначала пустая: новое значение помечается предупреждением, вы проверяете его и подтверждаете — оно попадает в базу, и дальше такие же значения проходят сами."},{id:"tree",question:"Что такое древо и порядок «2, 1, 3, *»?",answer:"Адрес дробится на части по запятым, а части — по пробелам: приписка («Респ.», «р-н», «ул.») и само значение. В базе части хранятся деревом, каждая внутри предыдущей: «г. Примерск» лежит внутри «Респ. Регион» — с другим регионом тот же «Примерск» уже не пройдёт. Порядок «2, 1, 3, *» говорит, в какой последовательности части ложатся в древо: вторая (регион), первая (индекс), третья (район), а «*» — все остальные по порядку. Поэтому индекс хранится под регионом, хоть и пишется первым."},{id:"confirm",question:"Почему у паспорта, СНИЛС, телефона всегда предупреждение?",answer:"Это индивидуальные значения — их нельзя проверить по базе, они свои у каждого человека. Поэтому их нужно проверить глазами и поставить галочку «Проверено, значение верное» у каждого человека отдельно. Если такое же значение есть у другого человека (в таблице или в базе людей) — это ошибка."},{id:"actual",question:"Что делает «Проверить с актуальной информацией»?",answer:"Ищет человека в базе людей по ФИО. Если запись найдена — все совпавшие поля отмечаются проверенными, а несовпавшие остаются как были и перечисляются. Если такого ФИО в базе нет — так и пишет. База людей пополняется кнопкой «В базу людей» у готовых анкет (а позже — отдельным приложением ручного ввода)."},{id:"vars",question:"Как подставить переменную?",answer:"В любом поле ввода нажмите Ctrl+Пробел — появится список глобальных переменных. Начните писать ключ или часть значения, чтобы сузить список; ↑↓ — выбор, Enter — вставить, Esc — закрыть. Сохранить значение в переменные можно из меню «⋯» у поля анкеты."},{id:"dict",question:"Откуда подсказки при наборе?",answer:"Это словарь подсказок: то, что вы вводите в поля, запоминается и подсказывается при наборе в таких же полях — в любом приложении DocAssist (имя — в полях имени, адрес — в полях адреса). ↓ — выбрать, Tab — подставить, Esc — скрыть. Посмотреть, удалить или выключить — на странице «Глобальные переменные». Хранится только в рабочей папке."},{id:"blocks",question:"Как задать формат значения?",answer:"«Шаблоны и правила» → столбец → «Готовый формат» или свой из блоков. Значение собирается из блоков по порядку. Основные: «Текст» (точные символы, например «8(»), «Пробел», «Цифры» (сколько), «Число от … до …» (например, курс от 1 до 11), «Одно из» (варианты по строкам), «Символы» (русские, латинские, цифры, свои, регистр, сколько). Готовые: «Любой текст» (слова через один пробел; можно «с заглавной», «только русские буквы», «кавычки только «ёлочки»»), «Слово с заглавной» (имя, фамилия, можно через дефис), «Дата» (только настоящие даты, диапазон лет), «Время», «Номер дома», «Почта». Любой блок можно сделать необязательным. Блоки идут вплотную, без разделителей; «Число» забирает все цифры подряд — «15» это 15, а не «1» и «5», поэтому между числом и цифрами ставьте «Текст» или «Пробел». Под блоками видно, что получилось словами, и пример; в «Проверить значение» видно, как значение разложилось по блокам или на каком месте оно не подошло."},{id:"regex",question:"Куда делись регулярные выражения (regex)?",answer:"С версии 0.4 формат задаётся только блоками. В regex легко ошибиться незаметно: «[1-11]» выглядит как «от 1 до 11», а на деле это одна цифра «1» — и курс «6» считается ошибкой. Блок «Число от 1 до 11» так не ошибается, а ошибка в анкете называет формат словами («телефон», «число от 1 до 11»). Свои форматы из 0.3 перенесены в блоки автоматически; если какой-то сложный regex перевести не удалось, в правилах у столбца стоит пометка «был свой regex» — соберите формат из блоков и сохраните."},{id:"mask",question:"Как предлагается исправление?",answer:"Когда значение не подошло под формат, приложение пробует простые исправления и предлагает первое, которое подходит: убрать лишние пробелы, поправить кавычки на «ёлочки», регистр («Ivanov@example.com» → «ivanov@example.com»), дописать нули в дате («1.1.2000» → «01.01.2000»), https:// у ссылки ВК. Если формат состоит из цифр, текста и пробелов (телефон, СНИЛС, дата), цифры значения раскладываются по местам: «80001112233» → «8(000)111-22-33», «+7 000 111 22 33» → «8(000)111-22-33». Шаблон этой раскладки виден под блоками: «Исправление по цифрам: 8(___)___-__-__». Исправление только предлагается — применяете его вы."},{id:"paste",question:"Можно ли не загружать файл, а вставить строки?",answer:"Да. Выделите строки в Excel или Google Таблицах, нажмите Ctrl+C, откройте «Проверку анкет» и нажмите Ctrl+V (не в поле ввода). Строка заголовков не обязательна — без неё столбцы понимаются по порядку анкеты. На телефоне — кнопка «Вставить из буфера»."}];function t6(){const{hash:e}=gs();return P.useEffect(()=>{var t;e&&((t=document.getElementById(e.slice(1)))==null||t.setAttribute("open",""))},[e]),p.jsxs("div",{className:"page page--narrow",children:[p.jsxs("div",{className:"page-head",children:[p.jsx("h1",{children:"Частые вопросы"}),p.jsx("p",{children:"Короткие ответы на то, о чём спрашивают чаще всего. Список будет пополняться."})]}),D_.map(t=>p.jsxs("details",{id:t.id,className:"faq",open:D_.length===1,children:[p.jsxs("summary",{ch
