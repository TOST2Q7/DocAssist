name: Релиз

# Как выпустить релиз (версия в теге должна совпадать с версией в package.json):
#  - на сайте GitHub: Releases → Draft a new release → тег v0.1.0 (создать при публикации) → Publish;
#    файлы приложения соберутся и прикрепятся к релизу автоматически;
#  - или из терминала: git tag v0.1.0 && git push origin v0.1.0 — релиз создастся сам.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# Тег, созданный при публикации релиза на сайте, может запустить оба события — выполняем их по очереди.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Проверка версии
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией в package.json ($PKG)"
            exit 1
          fi

      - name: Версия-файл (всё приложение в одном HTML)
        run: npx vite build --mode single

      - name: Веб-версия (относительные пути — работает из любой папки сервера)
        run: npx vite build --outDir dist-web
        env:
          BASE_PATH: ./

      - name: Упаковка
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp dist-single/index.html "release/DocAssist-$V.html"
          (cd dist-web && zip -qr "../release/DocAssist-web-$V.zip" .)
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES="docs/releases/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Релиз уже создан на сайте — прикрепляем файлы и, если описание пустое, добавляем заметки.
            gh release upload "$TAG" release/* --clobber
            if [ -f "$NOTES" ] && [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
            fi
          else
            if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
            gh release create "$TAG" release/* --title "DocAssist $TAG" "${ARGS[@]}"
          fi
